[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "regular-pipelines"
version = "0.1.0"
description = "Turn analysis notebooks/scripts into standalone pipeline scripts and run them locally or on SLURM."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Jack Forman" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
